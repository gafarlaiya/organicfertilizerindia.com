<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Approve team access - Gujarat Bio Organics</title>
<style>
:root{--ink:#1b2a22;--mut:#5d6b63;--line:#dfe6e1;--g:#1d6b3a;--hot:#b3261e;--bg:#f3f5f3}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:420px;margin:12vh auto;background:#fff;padding:1.5rem;border:1px solid var(--line);border-radius:12px}
h1{font-size:1.25rem;margin:.1rem 0 1rem}
dl{display:grid;grid-template-columns:90px 1fr;gap:.35rem .6rem;margin:0 0 1.2rem}
dt{color:var(--mut)}dd{margin:0;word-break:break-word;font-weight:600}
.acts{display:flex;gap:.6rem}
button{flex:1;padding:.7rem;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ok{background:var(--g);border-color:var(--g);color:#fff}
button:focus-visible{outline:3px solid #9cc9ad;outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
p{margin:.4rem 0}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 1rem;padding:.6rem .8rem}
legend{font-weight:600;padding:0 .3rem}
label.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem 0;cursor:pointer}
label.opt input{margin-top:.3rem}
label.opt small{display:block;color:var(--mut);font-size:.85rem}
.mut{color:var(--mut);font-size:.9rem}
.err{color:var(--hot)}
.done{color:var(--g);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Dashboard access request</h1>
  <div id="box"><p class="mut">Loading…</p></div>
</main>
<script>
(function(){
var FN='https://filbmvtclfcrrvxckema.supabase.co/functions/v1/team-access', KEY='sb_publishable_qbndsVEhemxGLYZa6P3PyQ_iDNmsmmT';
var box=document.getElementById('box');
var t=new URLSearchParams(location.search).get('t')||'';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function call(body){
  var r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)});
  var j=await r.json(); if(!r.ok)throw new Error(j.error||'Something went wrong'); return j;
}
var WORD={approved:'Approved. They can sign in now and have been emailed.',approved_partner:'Approved as area partner. They can sign in now and will see only their own leads.',rejected:'Rejected. This login cannot sign in.',expired:'This request is older than 14 days. Ask them to request access again.'};
function render(d){
  var when=new Date(d.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
  var html='<dl><dt>Name</dt><dd>'+esc(d.name)+'</dd><dt>Email</dt><dd>'+esc(d.email)+'</dd><dt>Asked</dt><dd>'+esc(when)+'</dd></dl>';
  if(d.status==='pending'){
    var parts=(d.partners||[]).map(function(p){return '<label class="opt"><input type="radio" name="as" value="'+esc(p.key)+'"><span>Area partner: '+esc(p.area)+'<small>Sees only the leads sent to '+esc(p.person)+(p.email?' (replaces '+esc(p.email)+')':'')+'</small></span></label>'}).join('');
    html+='<fieldset><legend>Give access as</legend><label class="opt"><input type="radio" name="as" value="team"><span>Head office team<small>Sees all leads, quotes and samples</small></span></label>'+parts+'</fieldset>'+
      '<div class="acts"><button class="ok" id="ap">Approve</button><button id="rj">Reject</button></div><p id="msg"></p>';
  }else{
    html+='<p class="'+(/^approved/.test(d.status)?'done':'mut')+'">'+esc(WORD[d.status]||d.status)+'</p>';
  }
  box.innerHTML=html;
  if(d.status==='pending'){
    document.getElementById('ap').onclick=function(){var c=box.querySelector('input[name=as]:checked');if(!c){document.getElementById('msg').innerHTML='<span class="err">Choose how to give access first.</span>';return}decide('approve',d,c.value)};
    document.getElementById('rj').onclick=function(){decide('reject',d)};
  }
}
async function decide(action,d,as){
  var bs=box.querySelectorAll('button'); bs.forEach(function(b){b.disabled=true});
  try{var j=await call({mode:'decide',token:t,action:action,as:as});d.status=j.status;render(d)}
  catch(x){document.getElementById('msg').innerHTML='<span class="err">'+esc(x.message)+'</span>';bs.forEach(function(b){b.disabled=false})}
}
if(!/^[0-9a-f]{48}$/.test(t)){box.innerHTML='<p class="err">This link is not valid.</p>';return}
call({mode:'view',token:t}).then(render).catch(function(x){box.innerHTML='<p class="err">'+esc(x.message)+'</p>'});
})();
</script>
</body>
</html>
